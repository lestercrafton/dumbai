/* Ovanova Moves — web. The same taste as the phone app (mobile/TASTE.md): calm, one idea per card, one filled

:root {

* { box-sizing: border-box; margin: 0; padding: 0; }

.brand svg { width: 28px; height: 28px; display: block; }
.who { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); min-width: 0; }
.who b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who a { color: var(--muted); text-decoration: none; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }

/* tabs: segmented at the top on wide screens, a bar at the bottom on phones */

    <div class="group"><div class="label">Climate</div><div class="chips">${B('climate-on', 'On')}${B('climate-off', 'Off')}${N('set-temp', 'Set', 'tf', 72, '°F')}</div></div>
    <div class="group"><div class="label">Charging</div><div class="chips">${B('charge-start', 'Start')}${B('charge-stop', 'Stop')}${N('charge-limit', 'Limit', 'cl', 80, '%')}${N('charge-amps', 'Amps', 'ca', 32, 'A')}</div></div>
    <div class="group"><div class="label">Car</div><div class="chips">${B('lock', 'Lock')}${B('unlock', 'Unlock')}${B('honk', 'Honk')}${B('flash', 'Flash lights')}${B('wake', 'Wake')}</div></div>
    <div class="small" style="margin-top:16px">Commands only work on cars in your own Tesla account. A sleeping car is woken first, which can take up to 30 seconds.</div></div>`;
}
async function sendCmd(o, confirmed) {
  const vin = cvin; cbusy = true; cmsg = { text: 'Sending…' }; render();
  try { const r = await api('/api/command', { vin, ...o, confirmed: !!confirmed });
    cmsg = r.needsConfirm ? { confirm: { label: r.label, cmd: r.cmd, arg: r.arg } } : { kind: 'ok', text: r.done || 'Done' }; }
  catch (e) { if (e.status === 401) return signin(); cmsg = { kind: 'warn', text: e.message, links: /approved|pair|key/i.test(e.message) }; }
  cbusy = false; render();
}
function listen() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { cmsg = { kind: 'warn', text: 'Voice input is not supported in this browser. Try Chrome or Safari, or type the command.' }; return render(); }
  const r = new R(); r.lang = 'en-US'; r.interimResults = false; $('#mic').style.background = 'var(--brand)'; $('#mic').style.color = '#fff';
  r.onresult = e => { $('#ct').value = e.results[0][0].transcript; };
  r.onend = () => { const m = $('#mic'); if (m) { m.style.background = ''; m.style.color = ''; } };
  r.onerror = e => { cmsg = { kind: 'warn', text: 'Mic: ' + e.error }; render(); };
  r.start();
}

// ---- Settings
function settings() {
  const s = S.settings || {}, sugar = s.sugar || {}, ntfy = s.ntfy || {}, we = s.weekEnd || {};
  const queued = (S.trips || []).filter(t => statusOf(t) === 'queued');
  return `<div class="stack">
    <div class="card"><div class="title">Reimbursements go to</div>
      <input class="input" id="st" type="email" value="${esc(sugar.to)}" placeholder="sugar@ovanova.co" style="margin-top:10px" autocapitalize="off">
      <input class="input" id="sc" type="email" value="${esc(sugar.cc)}" placeholder="CC (optional)" style="margin-top:8px" autocapitalize="off">
      <div class="row-label" style="margin-top:16px">${esc(batchName())}</div><div class="muted" style="font-size:14px">Batched trips go out together, every week at this time (Central).</div>
      <div class="grid2" style="margin-top:8px"><select class="input" id="wd" aria-label="Day">${DAYS.map((d, i) => `<option value="${i}" ${i == we.day ? 'selected' : ''}>${d}</option>`).join('')}</select>
        <input class="input" id="wt" type="time" value="${esc(we.time)}" aria-label="Time"></div>
      <div class="muted" style="margin-top:8px;font-size:14px">${S.nextBatch ? 'Next: ' + esc(fmtWhen(S.nextBatch)) + '.' : ''} ${queued.length ? esc(plural(queued.length, 'trip')) + ' · ' + mi(sumMi(queued)) + ' mi waiting.' : 'Nothing waiting.'}</div>
      ${queued.length ? `<div class="actions"><button class="big" data-act="sendBatch">Send now</button></div>` : ''}</div>
    <div class="card"><div class="title">Signature</div><textarea class="input" id="sg" rows="3" style="margin-top:10px" placeholder="How the email signs off">${esc(s.signature)}</textarea></div>
    <div class="card"><div class="title">Phone alerts</div><div class="muted" style="margin-top:2px;font-size:14px">Install the free ntfy app, subscribe to this topic, and each trip asks "business or personal?" on your phone. Pick a topic nobody would guess.</div>
      <input class="input" id="nt" value="${esc(ntfy.topic)}" placeholder="e.g. ${ntfySuggest}" style="margin-top:10px" autocapitalize="off" autocomplete="off"></div>
    <div class="actions" style="margin-top:4px"><button class="big primary" data-act="saveSettings">Save settings</button></div></div>`;
}
function settingsDirty() {
  const s = S.settings || {}, sugar = s.sugar || {}, ntfy = s.ntfy || {}, we = s.weekEnd || {};
  const same = (id, v) => { const el = $('#' + id); return !el || el.value === String(v ?? ''); };
  return !(same('st', sugar.to) && same('sc', sugar.cc) && same('sg', s.signature) && same('nt', ntfy.topic) && same('wd', we.day) && same('wt', we.time));
}
function saveSettings() {
  return act(() => api('/api/settings', { sugar: { to: $('#st').value.trim(), cc: $('#sc').value.trim() }, signature: $('#sg').value, ntfy: { topic: $('#nt').value.trim() }, weekEnd: { day: +$('#wd').value, time: $('#wt').value } }).then(() => 'Settings saved'));
}

// ---- events: one listener, data-act on every control
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'closeSheet' && el.classList.contains('scrim') && e.target !== el) return;
  if (a === 'tab') { tab = el.dataset.tab; if (location.hash !== '#' + tab) location.hash = tab; else render(); window.scrollTo(0, 0); }
  else if (a === 'biz') { biz = el.dataset.key; render(); }
  else if (a === 'back') { biz = null; render(); }
  else if (a === 'toggle') { open = open === id ? null : id; biz = null; render(); }
  else if (a === 'answer') answer(el.dataset.a, id ? [id] : sel.slice());
  else if (a === 'selecting') { selecting = !selecting; sel = selecting ? (S.trips || []).filter(t => statusOf(t) === 'untagged').map(t => t.id) : []; biz = null; render(); }
  else if (a === 'selAll') { const all = (S.trips || []).filter(t => statusOf(t) === 'untagged').map(t => t.id); sel = sel.length === all.length ? [] : all; render(); }
  else if (a === 'sel') { sel = sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id]; render(); }
  else if (a === 'showAll') { showAll = true; render(); }
  else if (a === 'adding') { adding = !adding; render(); if (adding) { const m = $('#mm'); if (m) m.focus(); } }
  else if (a === 'manual') addManual();
  else if (a === 'closeSheet') closeSheet();
  else if (a === 'confirmSend') confirmSend();
  else if (a === 'sendBatch') { if (settingsDirty()) toast('Save your settings first, then send.', true); else send((S.trips || []).filter(t => statusOf(t) === 'queued').map(t => t.id)); }
  else if (a === 'poll') act(async () => { const r = await api('/api/poll', {}); pollResult = r.states || r; return ''; });
  else if (a === 'car') { cvin = el.dataset.vin; render(); }
  else if (a === 'cmd') sendCmd({ cmd: el.dataset.cmd });
  else if (a === 'cmdn') sendCmd({ cmd: el.dataset.cmd, arg: +$('#' + el.dataset.for).value });
  else if (a === 'cmdtext') { const v = $('#ct').value.trim(); if (v) sendCmd({ text: v }); }
  else if (a === 'cmdConfirm') { const c = cmsg?.confirm; if (c) sendCmd({ cmd: c.cmd, arg: c.arg }, true); }
  else if (a === 'cmdCancel') { cmsg = { text: 'Cancelled' }; render(); }
  else if (a === 'listen') listen();
  else if (a === 'saveSettings') saveSettings();
});
document.addEventListener('change', e => { if (e.target.dataset.sel === 'cv') cvin = e.target.value; });
document.addEventListener('input', e => {
  if (e.target.id === 'pp') { const c = e.target.closest('[data-trip]'); if (c) drafts[c.dataset.trip] = e.target.value; }
  if (e.target.dataset.ctl) ctl[e.target.dataset.ctl] = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetIds) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'ct' && !cbusy) { const v = e.target.value.trim(); if (v) sendCmd({ text: v }); }
  if (e.key === 'Enter' && e.target.id === 'mm') addManual();
  if ((e.key === ' ' || e.key === 'Enter') && e.target.dataset.act === 'sel') { e.preventDefault(); e.target.click(); }
});
window.addEventListener('hashchange', () => { tab = hashTab(); if (S) render(); });
$('#mark').innerHTML = MARK;
load();
</script></body></html>
