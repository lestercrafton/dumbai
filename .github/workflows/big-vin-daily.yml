name: Big Vin daily sports experiment

on:
  workflow_dispatch:
    inputs:
      task:
        description: Recent scores, full daily collection, or weekly review
        type: choice
        options: [daily, weekly, refresh, results]
        default: daily
  push:
    paths:
      - 'big-vin/**'
      - '!big-vin/site/**'
      - '.github/workflows/big-vin-daily.yml'
  schedule:
    - cron: '17 7,8 * * *'
      timezone: America/Chicago
    - cron: '17 9 * * 2'
      timezone: America/Chicago
    - cron: '37 * * * *'
      timezone: America/Chicago

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: big-vin-experiment
  cancel-in-progress: false

jobs:
  experiment:
    if: github.repository == 'lestercrafton/dumbai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BIG_VIN_SITE_URL: https://big-vin-grind-to-win.sunlightisfree.chatgpt.site
      # Parallel Cloudflare site until cutover. Site writes are copied there; a failed copy only warns.
      BIG_VIN_MIRROR_URL: https://big-vin.sitetime.workers.dev
      BIG_VIN_MIRROR_LOG: /tmp/big-vin-mirror.jsonl
    defaults:
      run:
        working-directory: big-vin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select score, journal and research tasks
        id: plan
        env:
          BIG_VIN_TASK: ${{ inputs.task }}
          BIG_VIN_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/runner-plan.mjs
      - name: Verify checkpoint, grading and retry behavior
        run: npm test
      - name: Verify personal workflow identity with the Site
        run: node scripts/check-cloud-access.mjs
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/big-vin/site/scripts/mirror-writes.mjs
      - name: Restore the most recent checkpoint, including failed runs
        id: checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, name: 'big-vin-checkpoint', per_page: 100
            });
            const previous = artifacts.filter(a => !a.expired && a.workflow_run?.head_branch === 'main')
              .sort((a,b) => Date.parse(b.created_at)-Date.parse(a.created_at) || b.id-a.id)[0];
            if (!previous) { core.info('No cloud checkpoint yet; preparing from bootstrap and verified public history.'); return; }
            const response = await github.rest.actions.downloadArtifact({
              ...context.repo, artifact_id: previous.id, archive_format: 'zip'
            });
            fs.writeFileSync('big-vin/cloud-state.zip', Buffer.from(response.data));
            core.info(`Restored checkpoint artifact ${previous.id} from run ${previous.workflow_run.id}.`);
      - name: Extract checkpoint
        run: |
          mkdir -p "$HOME/.local/share/big-vin"
          if test -f cloud-state.zip; then unzip -oq cloud-state.zip -d "$HOME/.local/share/big-vin"; fi
      - name: Restore baseball source cache
        if: steps.plan.outputs.baseball == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/big-vin/baseball-stats
          key: big-vin-baseball-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            big-vin-baseball-v1-${{ runner.os }}-
      - name: Prepare portable checkpoints
        id: prepare
        run: node scripts/cloud-state.mjs prepare --skip-history
      - name: Refresh all sports with the full daily window
        if: steps.plan.outputs.collection == 'full'
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/big-vin/site/scripts/mirror-writes.mjs
        run: node scripts/collect-results.mjs --results-only
      - name: Refresh recent scores and today's markets
        if: steps.plan.outputs.collection == 'recent'
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/big-vin/site/scripts/mirror-writes.mjs
        run: node scripts/collect-results.mjs --results-only --recent
      - name: Collect all sports and publish the daily journal
        if: steps.plan.outputs.journal == 'true' && !cancelled() && steps.prepare.outcome == 'success'
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/big-vin/site/scripts/mirror-writes.mjs
        run: node scripts/daily-experiment.mjs
      - name: Save odds snapshots and shadow challenger picks
        id: shadow
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/big-vin/site/scripts/mirror-writes.mjs
          # Playbook documents go straight to the Cloudflare site (its own OIDC audience); a failure only warns.
          BIG_VIN_PLAYBOOK_POST: '1'
          BIG_VIN_PLAYBOOK_URL: https://big-vin.sitetime.workers.dev
        run: node scripts/shadow-challengers.mjs
      - name: Verify baseball refresh on demand
        if: steps.plan.outputs.refresh_baseball == 'true'
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/big-vin/site/scripts/mirror-writes.mjs
        run: node scripts/collect-mlb-stats.mjs
      - name: Publish Tuesday results review
        if: steps.plan.outputs.weekly == 'true'
        env:
          BIG_VIN_REVIEW_REPO_DIR: ${{ github.workspace }}/playbook/reviews
          NODE_OPTIONS: --import=${{ github.workspace }}/big-vin/site/scripts/mirror-writes.mjs
        run: node scripts/weekly-review.mjs --apply
      - name: Commit the odds log and shadow ledger
        if: always() && steps.shadow.outcome != 'skipped'
        continue-on-error: true
        working-directory: .
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          # git add stops at the first missing path, so add each folder that exists.
          for p in playbook/odds playbook/ledger playbook/reviews; do if test -e "$p"; then git add "$p"; fi; done
          if git diff --cached --quiet; then echo "No new odds or shadow records."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "Big Vin odds snapshots and shadow picks $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            if git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main; then exit 0; fi
            sleep $((attempt*10))
          done
          echo "::warning title=Shadow records::Could not push the odds log; the checkpoint artifact still has the ledger."
      - name: Preserve retry checkpoints even after a partial run
        if: always() && steps.prepare.outcome != 'skipped'
        run: node scripts/cloud-state.mjs pack --output checkpoint
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome != 'skipped'
        with:
          name: big-vin-checkpoint
          path: big-vin/checkpoint/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Preserve baseball cache for the next runner
        if: always() && steps.prepare.outcome != 'skipped' && steps.plan.outputs.baseball == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/big-vin/baseball-stats
          key: big-vin-baseball-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report the Cloudflare copy
        if: always()
        continue-on-error: true
        run: |
          f="$BIG_VIN_MIRROR_LOG"
          if ! test -s "$f"; then echo "No site writes were copied to $BIG_VIN_MIRROR_URL." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node -e 'const l=require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n").map(JSON.parse);const ok=l.filter(x=>x.ok).length;const by={};for(const x of l){const k=x.path+" "+(x.status??"error");by[k]=(by[k]||0)+1;}console.log(`### Cloudflare copy\n${ok} of ${l.length} site writes copied to ${process.env.BIG_VIN_MIRROR_URL}.\n\n`+Object.entries(by).map(([k,n])=>`- ${k}: ${n}`).join("\n"));' "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: Write visible run status
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_TASK: ${{ steps.plan.outputs.task }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          summary=['## Big Vin cloud experiment', 'Status: '+os.environ['RUN_STATUS'], 'Task: '+os.environ['RUN_TASK'],
            '', 'Personal repository: lestercrafton/dumbai.',
            'Scores refresh hourly at minute 37. Full daily collection runs at 7:17 and 8:17 a.m. Central; Tuesday review at 9:17.',
            'Hourly score refreshes do not create or rewrite the daily journal. GitHub may delay scheduled starts.',
            'All seven sports use saved pregame forecasts and original captured prices.',
            'Each formula/sport/cohort keeps its separate $500 paper bankroll; risk is 2% of the Eastern day\'s opening balance.',
            'Site: https://big-vin-grind-to-win.sunlightisfree.chatgpt.site/learning-log',
            'A failed or partial run requires attention; it is not a successful fresh report.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n\n'.join(summary)+'\n')
          PY
