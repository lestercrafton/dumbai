name: Mileage trip poll
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: mileage-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Poll vehicles
        env:
          CRON_SECRET: ${{ secrets.MILEAGE_CRON_SECRET }}
        run: |
          code=$(curl -sS -m 120 -o out.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" https://ovanova-mileage-tesla.vercel.app/api/cron)
          echo "HTTP $code"; cat out.json; echo
          test "$code" = 200
