name: Mileage tracker poll
# Polls Teslas and sends the end-of-week batch. Vercel Hobby cron is daily only, so this free schedule drives it.
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
concurrency: { group: mileage-poll, cancel-in-progress: false }
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Poll
        env: { CRON_SECRET: '${{ secrets.MILEAGE_CRON_SECRET }}' }
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "MILEAGE_CRON_SECRET not set"; exit 0; fi
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" https://ovanova-mileage-tesla.vercel.app/api/cron | head -c 2000
