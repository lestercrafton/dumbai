name: Milly independent weekly scientist
on:
  workflow_dispatch:
  push:
    paths:
      - 'milly_weekly_v1/**'
      - '.github/workflows/milly-independent-weekly-v1.yml'
  schedule:
    - cron: '17 13,14 * * 3,6'
    - cron: '43 15,16,17 * * 0'
    - cron: '27 13,14 * * 2'
permissions:
  contents: write
concurrency:
  group: milly-independent-weekly-v1
  cancel-in-progress: false
jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test scheduling and contest identity
        run: python milly_weekly_v1/test_schedule.py
      - name: Run once per contest, even when GitHub starts the schedule late
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: python milly_weekly_v1/plan.py
  research:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MILLY_SOLVES: '600'
      MILLY_WORLDS: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: milly_weekly_v1/requirements.txt
      - name: Install training and real-browser verification runtime
        run: |
          pip install -r milly_weekly_v1/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check sources compile and scheduling tests pass with the model runtime
        run: |
          python -m py_compile milly_weekly_v1/*.py
          python milly_weekly_v1/test_schedule.py
          (cd milly_weekly_v1 && python -m unittest test_grading)
      - name: Refresh inputs, train independent forecasts and generate the twenty
        run: python -u milly_weekly_v1/run.py
      - name: Read run outcome
        id: outcome
        run: |
          python - <<'PY'
          import json,os
          h=json.load(open('milly_weekly_v1/public/health.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('status='+h.get('status','unknown')+'\n')
          if h.get('status')=='waiting_for_pool':
              print('::warning title=Milly is waiting for the DraftKings player pool::'+h['error']+' '+h['previous_release']['note'])
          PY
      - name: Verify HTTP publication and a completed custom-world generation
        if: steps.outcome.outputs.status == 'success'
        run: python -u milly_weekly_v1/browser_verify.py
      - name: Last pre-lock publication check
        if: steps.outcome.outputs.status == 'success'
        run: |
          python - <<'PY'
          import json,datetime,pathlib
          p=pathlib.Path('milly_weekly_v1/public');d=json.loads((p/'latest.json').read_text())
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat(d['contest']['kickoff'])
          assert json.loads((p/'verification.json').read_text())['passed']
          assert json.loads((p/'browser-verification.json').read_text())['passed']
          assert json.loads((p/'health.json').read_text())['release_id']==d['release_id']
          print('Verified release',d['release_id'])
          PY
      - name: Preserve old publication on any failed release gate
        if: failure()
        run: |
          mkdir -p milly_weekly_v1/failed_run
          cp -a milly_weekly_v1/public/. milly_weekly_v1/failed_run/ 2>/dev/null || true
          git restore --worktree -- milly_weekly_v1/public 2>/dev/null || true
          git clean -fd -- milly_weekly_v1/public
          python - <<'PY'
          import json,pathlib,datetime,os
          p=pathlib.Path('milly_weekly_v1/public');p.mkdir(parents=True,exist_ok=True)
          import sys;sys.path.insert(0,'milly_weekly_v1');import contest
          try:detail=json.loads(pathlib.Path('milly_weekly_v1/failed_run/health.json').read_text()).get('error')
          except Exception:detail=None
          receipt={'status':'failed','at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'previous_release_preserved':True,'previous_release':contest.previous_release(p),'error':'A source, model, browser or final publication check failed. No staged release is approved.','detail':detail,'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          (p/'health.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Commit the approved release or explicit failure receipt
        if: always()
        run: |
          git config user.name 'Milly research bot'
          git config user.email 'milly-research@users.noreply.github.com'
          git add -A milly_weekly_v1
          git diff --cached --quiet || git commit -m 'Milly: dated independent forecast run and verification [skip ci]'
          bash milly_weekly_v1/push_results.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milly-independent-complete-run
          path: |
            milly_weekly_v1/
            .github/workflows/milly-independent-weekly-v1.yml
          include-hidden-files: true
          retention-days: 30
  grade:
    # When research does not run, still score finished slates (actual DK points and an estimated field percentile).
    needs: clock
    if: needs.clock.outputs.run != 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: milly_weekly_v1/requirements.txt
      - name: Install the model runtime without the browser
        run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.6.1
      - name: Test grading
        working-directory: milly_weekly_v1
        run: python -m unittest test_grading
      - name: Grade finished releases
        run: python -u milly_weekly_v1/grade_only.py
      - name: Commit grades
        if: always()
        run: |
          git config user.name 'Milly research bot'
          git config user.email 'milly-research@users.noreply.github.com'
          git add milly_weekly_v1/public/scorecard.json milly_weekly_v1/public/grades.jsonl milly_weekly_v1/public/grading-health.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Milly: graded finished slates [skip ci]'
          bash milly_weekly_v1/push_results.sh
  report:
    needs: [clock, research]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Make a skipped or failed research job visible
        env:
          CLOCK: ${{ needs.clock.result }}
          RESEARCH: ${{ needs.research.result }}
          REASON: ${{ needs.clock.outputs.reason }}
        run: |
          echo "Planner: $CLOCK. Research: $RESEARCH. $REASON" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CLOCK" != success ]; then echo "::error title=Milly planner failed::The run could not decide whether to train. Research did not run."; exit 1; fi
          if [ "$RESEARCH" = skipped ]; then echo "::warning title=Milly research skipped::$REASON"; fi
