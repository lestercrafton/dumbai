name: Milly independent weekly scientist
on:
  workflow_dispatch:
  push:
    paths:
      - 'milly_weekly_v1/**'
      - '.github/workflows/milly-independent-weekly-v1.yml'
  schedule:
    - cron: '17 13,14 * * 3,6'
    - cron: '43 15,16,17 * * 0'
    - cron: '27 13,14 * * 2'
permissions:
  contents: write
  issues: write
concurrency:
  group: milly-independent-weekly-v1
  cancel-in-progress: false
jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.time.outputs.run }}
    steps:
      - id: time
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime,zoneinfo,os
          t=datetime.datetime.now(zoneinfo.ZoneInfo('America/Chicago'))
          schedule=(t.weekday() in (2,5) and t.hour==8) or (t.weekday()==6 and t.hour in (10,11)) or (t.weekday()==1 and t.hour==8)
          active=os.environ['EVENT']!='schedule' or schedule
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+str(active).lower()+'\n')
          print('Local Central time',t.isoformat(),'run',active)
          PY
  research:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MILLY_SOLVES: '600'
      MILLY_WORLDS: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: milly_weekly_v1/requirements.txt
      - name: Install training and real-browser verification runtime
        run: |
          pip install -r milly_weekly_v1/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Normalize initial source migrations
        run: |
          python - <<'PY'
          import pathlib
          root=pathlib.Path('milly_weekly_v1')
          p=root/'core.py';s=p.read_text().replace('from site import render','from publication import render')
          s=s.replace("dep=dep[dep.stamp==last].copy();dep['team']", "dep=dep.sort_values('stamp').drop_duplicates(['team','gsis_id'],keep='last').copy();dep['team']")
          s=s.replace("if len(match)!=1:rejected.append", "if len(match)!=1 or pd.isna(match.iloc[0].get('gsis_id')):rejected.append")
          if "'source_receipts':" not in s:
              s=s.replace("'entry_ready':False,'independent_baseline':True", "'source_receipts':[json.loads(x) for x in (CACHE/'source-receipts.jsonl').read_text().splitlines()],'code_sha256':hashlib.sha256(pathlib.Path(__file__).read_bytes()).hexdigest(),'entry_ready':False,'independent_baseline':True")
          p.write_text(s)
          p=root/'run.py';s=p.read_text()
          s=s.replace('s=s.replace("save(STAGE/', 's=s if "world[\'point_scale\']=100" in s else s.replace("save(STAGE/')
          p.write_text(s)
          PY
          python -m py_compile milly_weekly_v1/*.py
      - name: Refresh inputs, train independent forecasts and generate the twenty
        run: python -u milly_weekly_v1/run.py
      - name: Verify HTTP publication and a completed custom-world generation
        run: python -u milly_weekly_v1/browser_verify.py
      - name: Last pre-lock publication check
        run: |
          python - <<'PY'
          import json,datetime,pathlib
          p=pathlib.Path('milly_weekly_v1/public');d=json.loads((p/'latest.json').read_text())
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat(d['contest']['kickoff'])
          assert json.loads((p/'verification.json').read_text())['passed']
          assert json.loads((p/'browser-verification.json').read_text())['passed']
          assert json.loads((p/'health.json').read_text())['release_id']==d['release_id']
          print('Verified release',d['release_id'])
          PY
      - name: Preserve old publication on any failed release gate
        if: failure()
        run: |
          mkdir -p milly_weekly_v1/failed_run
          cp -a milly_weekly_v1/public/. milly_weekly_v1/failed_run/ 2>/dev/null || true
          git restore --worktree -- milly_weekly_v1/public 2>/dev/null || true
          git clean -fd -- milly_weekly_v1/public
          python - <<'PY'
          import json,pathlib,datetime,os
          p=pathlib.Path('milly_weekly_v1/public');p.mkdir(parents=True,exist_ok=True)
          receipt={'status':'failed','at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'previous_release_preserved':True,'error':'A source, model, browser or final publication check failed. No staged release is approved.','run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          (p/'health.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Commit the approved release or explicit failure receipt
        if: always()
        run: |
          git config user.name 'Milly research bot'
          git config user.email 'milly-research@users.noreply.github.com'
          git add -A milly_weekly_v1
          git diff --cached --quiet || git commit -m 'Milly: dated independent forecast run and verification [skip ci]'
          git pull --rebase origin main
          git push
      - name: Visible alert when a run fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title='Milly independent weekly run needs attention';
            const body=`A release gate failed. No fresh lineups were approved. The last successful release is retained.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const response=await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100});
            const prior=response.data.find(x=>x.title===title);
            if(prior) await github.rest.issues.createComment({...context.repo,issue_number:prior.number,body});
            else await github.rest.issues.create({...context.repo,title,body});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milly-independent-complete-run
          path: |
            milly_weekly_v1/
            .github/workflows/milly-independent-weekly-v1.yml
          include-hidden-files: true
          retention-days: 30
