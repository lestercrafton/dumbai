name: Milly weekly scientist
on:
  workflow_dispatch:
  push:
    paths:
      - 'milly/*.py'
      - 'milly/site/**'
      - '.github/workflows/milly-weekly.yml'
  schedule:
    - cron: '17 8 * * 3,6'
      timezone: America/Chicago
    - cron: '43 10,11 * * 0'
      timezone: America/Chicago
    - cron: '27 8 * * 2'
      timezone: America/Chicago
permissions:
  contents: write
concurrency:
  group: milly-weekly
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model runtime
        run: pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.6.1
      - name: Fetch dated historical and current sources
        run: python milly/collect.py
      - name: Train, evaluate, generate and archive
        run: |
          if test -f milly/pipeline.py; then python milly/pipeline.py; fi
          if test -f milly/test_pipeline.py; then python milly/test_pipeline.py; fi
      - name: Commit public evidence and latest release
        if: always()
        run: |
          git config user.name 'Milly research bot'
          git config user.email 'milly-bot@users.noreply.github.com'
          git add milly/public
          git diff --cached --quiet || git commit -m 'Milly: archive research run and refresh public evidence [skip ci]'
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milly-complete-run
          path: |
            milly/
            .github/workflows/milly-weekly.yml
          retention-days: 30
