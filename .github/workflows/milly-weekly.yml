name: Milly weekly scientist
on:
  workflow_dispatch:
  push:
    paths:
      - 'milly/**'
      - '.github/workflows/milly-weekly.yml'
  schedule:
    - cron: '17 13 * * 3,6'
    - cron: '43 15,16 * * 0'
    - cron: '27 13 * * 2'
permissions:
  contents: write
concurrency:
  group: milly-weekly
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public data access
        run: |
          mkdir -p milly/public
          python - <<'PY'
          import urllib.request,json,datetime,pathlib
          sources=[('schedule','https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv'),('stats_2025','https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv')]
          results=[]
          for name,url in sources:
              try:
                  with urllib.request.urlopen(url,timeout=45) as r: data=r.read()
                  results.append({'name':name,'url':url,'bytes':len(data),'header':data.decode('utf-8-sig').splitlines()[0],'ok':True})
              except Exception as e: results.append({'name':name,'url':url,'error':str(e),'ok':False})
          pathlib.Path('milly/public/runner-health.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'stage':'connectivity_only','sources':results},indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Commit run receipt
        run: |
          git config user.name 'Milly research bot'
          git config user.email 'milly-bot@users.noreply.github.com'
          git add milly/public/runner-health.json
          git diff --cached --quiet || git commit -m 'Milly: record execution receipt [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milly-run-receipt
          path: milly/public/
          retention-days: 30
