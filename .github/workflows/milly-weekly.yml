name: Milly weekly scientist
on:
  workflow_dispatch:
  push:
    paths:
      - 'milly/*.py'
      - '.github/workflows/milly-weekly.yml'
  schedule:
    - cron: '17 8 * * 3,6'
      timezone: America/Chicago
    - cron: '43 10,11 * * 0'
      timezone: America/Chicago
    - cron: '27 8 * * 2'
      timezone: America/Chicago
permissions:
  contents: write
concurrency:
  group: milly-weekly
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned model runtime
        run: pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Test scoring, temporal features, roster constraints and simulation invariants
        run: python milly/test_pipeline.py
      - name: Fetch fresh historical and current sources
        run: python milly/collect.py
      - name: Grade frozen predictions and version stat corrections
        run: python milly/grade.py
      - name: Train, evaluate, generate and publish validated independent release
        run: python milly/run_weekly.py
      - name: Record a failed refresh without relabelling old predictions
        if: failure()
        run: |
          python - <<'PY'
          import json,datetime,pathlib
          p=pathlib.Path('milly/public');p.mkdir(parents=True,exist_ok=True)
          status={'state':'failed','finished_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'error':'Weekly refresh failed a source, model or validation check. Consult this Actions run. Last release is not automatically current.','last_release_preserved':True}
          (p/'runner-status.json').write_text(json.dumps(status))
          PY
      - name: Commit public evidence, frozen release and current status
        if: always()
        run: |
          git config user.name 'Milly research bot'
          git config user.email 'milly-bot@users.noreply.github.com'
          git add milly/public
          git diff --cached --quiet || git commit -m 'Milly: publish validated research or explicit refresh failure [skip ci]'
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milly-complete-run
          path: |
            milly/
            .github/workflows/milly-weekly.yml
          retention-days: 30
