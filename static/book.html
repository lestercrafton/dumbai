<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a meeting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .day-btn.selected { background:#2563eb; color:#fff; border-color:#2563eb; }
    .slot-btn.selected { background:#2563eb; color:#fff; border-color:#2563eb; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Loading state -->
  <div id="loadingState" class="flex items-center justify-center min-h-screen">
    <div class="text-gray-400 text-sm">Loading…</div>
  </div>

  <!-- Error state -->
  <div id="errorState" class="hidden flex items-center justify-center min-h-screen">
    <div class="text-center">
      <p class="text-gray-500 text-lg font-medium" id="errorMsg">Something went wrong.</p>
      <a href="/" class="text-blue-600 text-sm mt-3 inline-block">Go home</a>
    </div>
  </div>

  <!-- Main booking UI -->
  <div id="mainUI" class="hidden max-w-5xl mx-auto px-4 py-12">

    <!-- Left panel: host info + event details -->
    <div class="grid md:grid-cols-[280px_1fr] gap-0 bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200">

      <div id="leftPanel" class="border-r border-gray-100 p-8">
        <img id="hostPic" class="w-14 h-14 rounded-full bg-gray-200 mb-4 hidden" />
        <p class="text-sm text-gray-500 font-medium" id="hostName"></p>
        <h1 class="text-xl font-bold text-gray-900 mt-1 mb-2" id="eventName"></h1>
        <div class="flex items-center gap-2 text-sm text-gray-500 mb-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span id="eventDuration"></span>
        </div>
        <div class="flex items-center gap-2 text-sm text-gray-500 mb-4" id="locationRow">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span id="eventLocation"></span>
        </div>
        <p class="text-sm text-gray-500" id="eventDesc"></p>

        <!-- Selected date/time recap (step 2+) -->
        <div id="selectionRecap" class="hidden mt-6 pt-6 border-t border-gray-100">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Selected time</p>
          <p class="text-sm font-medium text-gray-800" id="selectedDateTime"></p>
          <p class="text-xs text-gray-400 mt-0.5" id="selectedTZ"></p>
        </div>
      </div>

      <!-- Step 1: Pick a date and time -->
      <div id="step1" class="p-8">
        <h2 class="text-base font-semibold text-gray-800 mb-5">Select a date &amp; time</h2>

        <!-- Calendar strip: next 14 days -->
        <div class="flex gap-2 flex-wrap mb-6" id="dateStrip"></div>

        <!-- Time slots -->
        <div id="slotsArea">
          <p class="text-sm text-gray-400 text-center py-8" id="slotsPlaceholder">Select a date to see available times.</p>
          <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 hidden" id="slotsGrid"></div>
          <p class="text-sm text-gray-400 text-center py-8 hidden" id="noSlots">No slots available on this day.</p>
        </div>
      </div>

      <!-- Step 2: Fill in details -->
      <div id="step2" class="hidden p-8 md:col-start-2">
        <button onclick="goBackToStep1()" class="text-sm text-blue-600 flex items-center gap-1 mb-6 hover:underline">
          ← Back
        </button>
        <h2 class="text-base font-semibold text-gray-800 mb-6">Enter your details</h2>
        <div class="space-y-4 max-w-sm">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
            <input id="bookName" type="text" placeholder="Your name"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
            <input id="bookEmail" type="email" placeholder="you@example.com"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
            <textarea id="bookNotes" rows="3" placeholder="Anything helpful to share…"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
          </div>
          <button onclick="submitBooking()"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold text-sm hover:bg-blue-700 transition">
            Confirm booking
          </button>
        </div>
      </div>

      <!-- Step 3: Confirmation -->
      <div id="step3" class="hidden p-8 md:col-start-2 flex flex-col items-center justify-center text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-5">
          <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="text-xl font-bold text-gray-900 mb-2">You're booked!</h2>
        <p class="text-gray-500 text-sm mb-1" id="confirmDetails"></p>
        <p class="text-gray-500 text-sm" id="confirmCalendar"></p>
      </div>

    </div>
  </div>

  <script>
    const pathParts = location.pathname.split('/').filter(Boolean);
    // /book/{username}/{slug}
    const USERNAME = pathParts[1];
    const SLUG = pathParts[2];

    let hostData = null;
    let eventType = null;
    let selectedDate = null;
    let selectedSlot = null;
    const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // ── Init ──────────────────────────────────────────────────────────────────
    (async function init() {
      try {
        hostData = await fetch(`/api/book/${USERNAME}`).then(r => {
          if (!r.ok) throw new Error('Not found');
          return r.json();
        });
        eventType = hostData.event_types.find(et => et.slug === SLUG);
        if (!eventType) throw new Error('Event type not found');
        renderInfo();
        renderDateStrip();
        show('mainUI');
        hide('loadingState');
      } catch (e) {
        document.getElementById('errorMsg').textContent = e.message || 'Page not found.';
        show('errorState');
        hide('loadingState');
      }
    })();

    function renderInfo() {
      const pic = document.getElementById('hostPic');
      if (hostData.picture_url) { pic.src = hostData.picture_url; pic.classList.remove('hidden'); }
      document.getElementById('hostName').textContent = hostData.name;
      document.getElementById('eventName').textContent = eventType.name;
      document.getElementById('eventDuration').textContent = `${eventType.duration_minutes} minutes`;
      if (eventType.description) document.getElementById('eventDesc').textContent = eventType.description;
      if (eventType.location) {
        document.getElementById('eventLocation').textContent = eventType.location;
      } else {
        document.getElementById('locationRow').classList.add('hidden');
      }
    }

    function renderDateStrip() {
      const strip = document.getElementById('dateStrip');
      strip.innerHTML = '';
      const today = new Date();
      for (let i = 0; i < 14; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const iso = isoDate(d);
        const label = i === 0 ? 'Today'
                    : i === 1 ? 'Tomorrow'
                    : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        strip.insertAdjacentHTML('beforeend', `
          <button class="day-btn border border-gray-200 rounded-xl px-4 py-2 text-sm font-medium text-gray-700 hover:border-blue-400 transition whitespace-nowrap"
                  data-date="${iso}" onclick="selectDate('${iso}', this)">
            ${label}
          </button>`);
      }
    }

    async function selectDate(dateStr, btn) {
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDate = dateStr;
      selectedSlot = null;

      hide('slotsPlaceholder');
      hide('noSlots');
      const grid = document.getElementById('slotsGrid');
      grid.classList.add('hidden');
      grid.innerHTML = '<p class="text-xs text-gray-400 col-span-4 py-2 text-center">Loading…</p>';
      grid.classList.remove('hidden');

      const slots = await fetch(
        `/api/book/${USERNAME}/${SLUG}/slots?date_str=${dateStr}`
      ).then(r => r.json());

      grid.innerHTML = '';
      if (!slots.length) {
        grid.classList.add('hidden');
        show('noSlots');
        return;
      }

      slots.forEach(slot => {
        const start = new Date(slot.start + 'Z');
        const label = start.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        grid.insertAdjacentHTML('beforeend', `
          <button class="slot-btn border border-gray-200 rounded-lg py-2 text-sm font-medium text-gray-700 hover:border-blue-400 transition"
                  data-start="${slot.start}" onclick="selectSlot('${slot.start}', '${slot.end}', this)">
            ${label}
          </button>`);
      });
      grid.classList.remove('hidden');
    }

    function selectSlot(startIso, endIso, btn) {
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSlot = { start: startIso, end: endIso };

      const startDt = new Date(startIso + 'Z');
      const endDt   = new Date(endIso + 'Z');
      document.getElementById('selectedDateTime').textContent =
        `${startDt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} · ` +
        `${startDt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})} – ` +
        `${endDt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}`;
      document.getElementById('selectedTZ').textContent = TZ;
      show('selectionRecap');

      // Slight delay so user can see the selection, then go to step 2
      setTimeout(() => {
        hide('step1');
        show('step2');
      }, 400);
    }

    function goBackToStep1() {
      hide('step2');
      show('step1');
    }

    async function submitBooking() {
      const name  = document.getElementById('bookName').value.trim();
      const email = document.getElementById('bookEmail').value.trim();
      const notes = document.getElementById('bookNotes').value.trim();

      if (!name || !email) return alert('Please fill in your name and email.');
      if (!selectedSlot) return alert('Please select a time slot.');

      try {
        const res = await fetch(`/api/book/${USERNAME}/${SLUG}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name, email, notes,
            start_time: selectedSlot.start,
          }),
        });
        if (!res.ok) throw new Error(await res.text());
        const booking = await res.json();

        const startDt = new Date(booking.start_time + 'Z');
        const endDt   = new Date(booking.end_time + 'Z');
        document.getElementById('confirmDetails').textContent =
          `${booking.event_type} with ${booking.host_name} · ` +
          `${startDt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} ` +
          `${startDt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})} – ` +
          `${endDt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}`;
        document.getElementById('confirmCalendar').textContent =
          booking.google_event_created
            ? 'A calendar invite has been sent to your email.'
            : 'Your booking is confirmed.';

        hide('step2');
        show('step3');
      } catch (e) {
        alert('Booking failed: ' + e.message);
      }
    }

    // ── Utils ─────────────────────────────────────────────────────────────────
    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }

    function isoDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
  </script>
</body>
</html>
